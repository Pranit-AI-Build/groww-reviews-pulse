# Render.com deployment configuration
services:
  - type: web
    name: groww-reviews-dashboard
    runtime: docker
    plan: standard
    envVars:
      - key: GROQ_API_KEY
        sync: false  # Set in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false  # Set in Render dashboard
      - key: SMTP_PASSWORD
        sync: false  # Set in Render dashboard
      - key: EMAIL_FROM
        sync: false  # Set in Render dashboard
      - key: PYTHONPATH
        value: /app
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
