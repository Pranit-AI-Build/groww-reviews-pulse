# Render.com deployment configuration
services:
  - type: web
    name: groww-reviews-dashboard
    runtime: python
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt && pip install schedule"
    startCommand: "bash start.sh"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PYTHONPATH
        value: /opt/render/project/src
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
